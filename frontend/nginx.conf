server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page application routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The frontend always calls a relative /api path, so no API host is baked
    # into the bundle at build time.
    location /api/ {
        # Above the application's own 48 MiB ingest ceiling, deliberately.
        #
        # nginx's default is 1 MiB, which silently sat below the 8 MiB the
        # analysis endpoint documents per timeframe: a legitimate multi-
        # timeframe upload was rejected with an nginx HTML page instead of the
        # application's typed error. The proxy is the coarse backstop for the
        # truly enormous; the application is the authority on what it accepts,
        # and it answers in JSON.
        client_max_body_size 52m;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
