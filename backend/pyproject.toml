[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viop-ai-backend"
version = "0.1.0"
description = "VIOP AI Market Intelligence - analysis and decision-support backend"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Every dependency below is justified against the master specification.
# Adding a dependency without a reason violates section 106.
dependencies = [
    "fastapi>=0.115",          # section 94: API framework
    "uvicorn[standard]>=0.30",  # ASGI server
    "pydantic>=2.7",            # section 94: Pydantic v2 (API edge + settings)
    "pydantic-settings>=2.3",   # section 98: configuration via environment variables
    # section 94: ORM, persistence adapter only. The asyncio extra is what the
    # code uses (it brings greenlet); from 2.1 greenlet is no longer installed
    # without it. Held to 2.0.x, the line every test ran against, so a fresh
    # image cannot silently run a newer, untested SQLAlchemy (Phase 14 Part 2B).
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13",            # section 94: schema migrations
    "psycopg[binary]>=3.1",     # section 94: PostgreSQL driver
    # ---- Phase 6 (vision). Each of these has a stated reason; see below. ----
    # Real bounded image decode before any byte leaves the process. Required by
    # the Phase 6A human review, which ruled out extending the hand-written
    # header parser into a home-grown decoder. Used in exactly one module,
    # app/application/vision/decode.py, and its decompression-bomb guard is
    # configured from policy rather than suppressed.
    "pillow>=11.0",
    # section 68/69: the Claude Vision provider. Confined to
    # app/adapters/vision/, enforced by test and by the SDK never appearing in
    # a port, a use case or the domain.
    "anthropic>=0.40",
    # Required by FastAPI to parse multipart uploads. Without it the screenshot
    # endpoint cannot accept a file at all - this is a framework requirement,
    # not a convenience.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",              # section 99: mandatory testing
    "pytest-asyncio>=0.23",     # section 99: async tests
    "httpx>=0.27",              # ASGI test client for FastAPI
    "ruff>=0.5",                # section 100: lint + format
    "mypy>=1.10",               # section 100: strict typing
    "import-linter>=2.0",       # sections 94/95: enforce dependency direction
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------
# Ruff - section 100
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "ANN",      # missing type annotations
    "S",        # bandit security rules
    "C4", "SIM", "RET", "PTH", "N",
]
ignore = [
    "ANN401",  # allow explicit `object`/Any-like escape hatches where documented
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]  # asserts and fixture secrets are expected
"alembic/**" = ["ANN", "N", "E501"]  # generated migration scaffolding

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --------------------------------------------------------------------------
# mypy strict - section 100
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = []
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

# --------------------------------------------------------------------------
# pytest - section 99
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: pure in-process test, no external services",
    "integration: requires a reachable PostgreSQL instance",
]

# --------------------------------------------------------------------------
# import-linter - sections 94/95 dependency direction, enforced mechanically
# --------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
# Required so that forbidden third-party modules (fastapi, sqlalchemy, ...)
# are visible to the contracts, not only first-party ones.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no framework, no infrastructure, no outer layers"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "anthropic",
    "httpx",
    "requests",
    "pydantic",
    "pydantic_settings",
    "app.application",
    "app.adapters",
    "app.api",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "Application depends only on domain, never on infrastructure or API"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "anthropic",
    "httpx",
    "requests",
    "app.adapters",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "Adapters never depend on the API layer"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
# Phase 1. Indicator mathematics is the numerical authority (master spec
# section 1) and is tested and type-checked as such. An adapter that computed
# an average would move a financial calculation outside that guarantee, so the
# rule is mechanical rather than a review habit.
name = "Adapters never compute indicators, structure, risk or contract maths"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = [
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.risk",
    "app.domain.analysis",
]
# Direct imports only, since Phase 7B.
#
# The guarantee this contract exists for is that no adapter *computes* a
# financial value - and computing one requires directly importing the module
# that does it, which is still caught. What the module-level phrasing could not
# express is the transitive case: the synthesis adapter returns a
# `SynthesisDraft`, whose `ScenarioCase` lives in `app.domain.analysis`, so
# *any* synthesis adapter reaches the analysis package through its own return
# type. Forbidding that would forbid the adapter existing at all, not stop it
# calculating anything.
#
# Verified before relaxing: no adapter in the tree directly imports any of
# these packages, so nothing already-broken is being hidden, and
# `test_architecture.py` proves a direct import still breaks this contract.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Phase 3. The risk engine is the numerical authority for money (master spec
# sections 1 and 42) and must stay reusable identically by live, replay,
# backtest, paper trading and shadow mode. Reaching into market structure or
# indicators would couple a P&L figure to an analysis opinion, and section 45's
# volatility-aware warnings are deferred precisely so that coupling does not
# arrive by accident.
name = "The risk engine depends only on contract facts, never on analysis"
type = "forbidden"
source_modules = ["app.domain.risk"]
forbidden_modules = ["app.domain.structure", "app.domain.technical", "app.domain.analysis"]

[[tool.importlinter.contracts]]
# Phase 4A. Analysis is the top of the domain: it consumes the technical,
# structural and futures engines and nothing consumes it back. The reverse
# direction would let an indicator or a swing depend on a multi-timeframe
# opinion, which is the circular definition every earlier contract exists to
# prevent - and it would let evidence quietly become an input to itself.
name = "Nothing beneath the analysis layer depends on it"
type = "forbidden"
source_modules = [
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.futures",
    "app.domain.market",
    "app.domain.common",
    "app.domain.instrument",
]
forbidden_modules = ["app.domain.analysis"]

[[tool.importlinter.contracts]]
# Phase 4A. Evidence describes the market; risk describes an account. Keeping
# them apart stops a position size from leaking into an analytical reading and
# stops evidence from acquiring a money dimension it has no authority over. It
# also mechanically preserves the Phase 4B boundary: converting evidence into a
# trade needs both, and that conversion does not exist yet.
name = "The analysis layer never depends on the risk engine"
type = "forbidden"
source_modules = ["app.domain.analysis"]
forbidden_modules = ["app.domain.risk"]

[[tool.importlinter.contracts]]
# Phase 4B. Master spec section 43 separates setup quality from trade
# suitability. `app.domain.suitability` is the single place allowed to depend
# on both analysis and risk, and it sits above both so that neither has to know
# about the other: a technical score must read identically for every user, and
# it cannot if an account balance can reach it. Nothing may depend on
# suitability in return - a veto is the end of the chain, not an input to the
# things it vetoes.
name = "Nothing beneath the suitability layer depends on it"
type = "forbidden"
source_modules = [
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.futures",
    "app.domain.market",
    "app.domain.common",
    "app.domain.risk",
    "app.domain.analysis",
    "app.domain.instrument",
]
forbidden_modules = ["app.domain.suitability"]

[[tool.importlinter.contracts]]
# Phase 8.5. The risk engine reasons about a budget, a stop, a loss per unit and
# a margin constraint - for any product. Everything product-specific arrives
# through a `ProductPolicy`. If this package could import the futures domain, the
# first "just read the multiplier here" would quietly make every future asset
# class a futures-shaped special case. The dependency runs futures -> risk, the
# way a plugin depends on its core.
name = "The generic risk engine depends on no product implementation"
type = "forbidden"
source_modules = ["app.domain.risk"]
forbidden_modules = ["app.domain.futures"]

[[tool.importlinter.contracts]]
# Phase 8.5. Instrument identity and the product-policy boundary are the bottom
# of the product stack: every product and every generic engine depends on them,
# so they may depend on nothing but `common`. A boundary that imported a product
# would stop being a boundary.
name = "The instrument boundary depends only on common vocabulary"
type = "forbidden"
source_modules = ["app.domain.instrument"]
forbidden_modules = [
    "app.domain.futures",
    "app.domain.risk",
    "app.domain.analysis",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.market",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
]

[[tool.importlinter.contracts]]
# Phase 8.5. OHLCV validation, indicators, structure, multi-timeframe evidence,
# suitability, synthesis and vision are the same mathematics for every market.
# None of them may reach a product policy or a product's money entry points: a
# market-intelligence reading that changed with the asset class would no longer
# be the same engine across markets. (Optional basis and open-interest evidence
# still arrive as plain futures readings, as they have since Phase 4.)
name = "The analysis core does not depend on product policies"
type = "forbidden"
source_modules = [
    "app.domain.market",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
    "app.application.synthesis",
    "app.application.vision",
    "app.application.presentation",
]
forbidden_modules = ["app.domain.futures.policy", "app.domain.futures.risk"]

[[tool.importlinter.contracts]]
# Phase 9. Paper trading is generic: a position has a symbol, a direction, whole
# units and price levels, and everything product-specific - what a point is
# worth, whether a level is on the price grid, whether the product can be
# calculated at all - arrives through a `ProductPolicy`. If this package could
# import the futures domain, the first "just read the multiplier here" would make
# every later asset class a futures-shaped special case. It also may not reach
# the analysis stack: a simulated fill depends on a bar and a plan, never on an
# opinion about the market.
name = "The paper-trading domain depends on no product implementation or analysis engine"
type = "forbidden"
source_modules = ["app.domain.paper"]
forbidden_modules = [
    "app.domain.futures",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
]

[[tool.importlinter.contracts]]
# Phase 10. Performance summarises outcomes; it must not know what produced them.
# Importing the paper domain would tie every metric to one simulator, and a future
# replay or backtest would have to either duplicate the metrics or pretend to be
# paper trading. Importing a product implementation would put futures arithmetic
# inside a layer that only adds up amounts other engines already computed.
name = "The performance domain depends on no product, simulator or analysis engine"
type = "forbidden"
source_modules = ["app.domain.performance", "app.domain.journal"]
forbidden_modules = [
    "app.domain.futures",
    "app.domain.paper",
    "app.domain.risk",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
]

[[tool.importlinter.contracts]]
# Phase 10. Nothing underneath may consume performance: a risk engine or a paper
# position that could read its own win rate would let yesterday's statistics feed
# today's simulated decision.
name = "Nothing beneath performance depends on it"
type = "forbidden"
source_modules = [
    "app.domain.common",
    "app.domain.instrument",
    "app.domain.market",
    "app.domain.risk",
    "app.domain.futures",
    "app.domain.paper",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
]
forbidden_modules = ["app.domain.performance", "app.domain.journal"]

[[tool.importlinter.contracts]]
# Phase 10. The performance use cases reach storage only through their ports, so
# the calculator is never coupled to PostgreSQL and a future outcome source can
# implement the same protocol.
name = "The performance application layer reaches storage only through its ports"
type = "forbidden"
source_modules = ["app.application.performance"]
forbidden_modules = [
    "app.adapters",
    "app.api",
    "sqlalchemy",
    "app.domain.futures",
]

[[tool.importlinter.contracts]]
# Phase 9. Paper trading consumes the risk engine and the product boundary; nothing
# consumes paper state back. A risk figure that could read a simulated position -
# or an analysis that knew a paper trade was open - would let a simulation feed
# into the calculations it is supposed to be simulating.
name = "Nothing beneath paper trading depends on it"
type = "forbidden"
source_modules = [
    "app.domain.common",
    "app.domain.instrument",
    "app.domain.market",
    "app.domain.risk",
    "app.domain.futures",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
]
forbidden_modules = ["app.domain.paper"]

[[tool.importlinter.contracts]]
# Phase 9. The paper use cases resolve a product through `ProductResolver` and
# restore one through `ProductSnapshotCodec`; the futures implementations of both
# live in adapters. Importing the futures domain here would make the composition
# of products an application decision, and importing the analysis orchestrator
# would couple opening a paper trade to having run an analysis - which Phase 9
# deliberately does not do.
name = "The paper application layer reaches products only through its ports"
type = "forbidden"
source_modules = ["app.application.paper"]
forbidden_modules = [
    "app.domain.futures",
    "app.application.analysis",
    "app.adapters",
    "app.api",
]

[[tool.importlinter.contracts]]
# Phase 3. Futures contract facts are inputs to analysis, never outputs of it.
name = "The futures domain does not depend on analysis engines"
type = "forbidden"
source_modules = ["app.domain.futures"]
forbidden_modules = ["app.domain.structure", "app.domain.technical"]

[[tool.importlinter.contracts]]
# Phase 2. The dependency runs structure -> technical and never back. Phase 1
# indicators must stay usable on their own - by a replay harness, a backtest or
# a chart - without dragging in swing detection, and an indicator that reached
# for market structure would be a circular definition waiting to happen.
name = "The technical engine does not depend on market structure"
type = "forbidden"
source_modules = ["app.domain.technical"]
forbidden_modules = ["app.domain.structure"]

[[tool.importlinter.contracts]]
# Phase 6A. Master spec section 1 and section 65: Claude Vision is
# supplementary and must never become the source of numeric truth. A
# screenshot observation is an *input to precedence*, never an input to a
# formula, so no calculation engine may import the vision package at all.
# This is section 16 of the Phase 6A brief made mechanical: an EMA, an RSI, a
# P&L or a position size cannot be derived from something a model read off a
# picture, because the module that would do it cannot see the module that
# holds it.
name = "No calculation engine depends on screenshot vision"
type = "forbidden"
source_modules = [
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.futures",
    "app.domain.risk",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.market",
]
forbidden_modules = ["app.domain.vision"]

[[tool.importlinter.contracts]]
# Phase 7A. Synthesis is the top of the domain: it reads finished results from
# every engine below and nothing reads it back. The reverse direction would let
# an indicator, a risk figure or a veto depend on what a narrative concluded,
# which is the circular definition every earlier contract exists to prevent -
# and it is the specific way an LLM's opinion would leak into a number.
name = "Nothing beneath the synthesis layer depends on it"
type = "forbidden"
source_modules = [
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.futures",
    "app.domain.market",
    "app.domain.common",
    "app.domain.risk",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.vision",
]
forbidden_modules = ["app.domain.synthesis"]

[[tool.importlinter.contracts]]
# Phase 7A. Master spec section 1 and CLAUDE.md: the LLM interprets and
# explains, and is never the source of truth for a number. Synthesis aggregates
# finished results; it has no business calling an indicator routine, and a
# second implementation of one is exactly how two answers to the same question
# appear.
#
# `allow_indirect_imports` is set deliberately. Synthesis must import the
# Phase 4 veto, which legitimately reaches down through structure to the
# indicator layer - forbidding that chain would forbid reading the veto at all.
# The real boundary is the *direct* one: synthesis may hold a finished
# `PositionSizing` or `SetupQuality`, and may not reach for the maths module
# that computed it.
name = "The synthesis layer never calls an indicator routine directly"
type = "forbidden"
source_modules = ["app.domain.synthesis", "app.application.synthesis"]
forbidden_modules = [
    "app.domain.technical.engine",
    "app.domain.technical.momentum",
    "app.domain.technical.smoothing",
    "app.domain.technical.trend_strength",
    "app.domain.technical.volatility",
    "app.domain.technical.volume",
    "app.domain.technical.vwap",
    "app.domain.risk.margin",
    "app.domain.risk.pnl",
    "app.domain.risk.whatif",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Phase 7A. No provider SDK exists in this phase at all, and the port must stay
# vendor-free so 7B's adapter is the only place a client type appears.
name = "The synthesis layer holds no provider SDK"
type = "forbidden"
source_modules = ["app.domain.synthesis", "app.application.synthesis", "app.application.ports"]
forbidden_modules = ["anthropic", "httpx", "requests", "openai"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Phase 11. The replay domain decides one thing: which candles had finished by a
# given market moment. It must not learn what a product is, what a position is
# worth or what an indicator says - any of those would make "what was visible at
# the time" depend on the engines that are supposed to consume it, and replay
# would become a second, quieter implementation of them.
name = "The replay domain knows only market time, not products, engines or money"
type = "forbidden"
source_modules = ["app.domain.replay"]
forbidden_modules = [
    "app.domain.futures",
    "app.domain.paper",
    "app.domain.performance",
    "app.domain.journal",
    "app.domain.risk",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
]

[[tool.importlinter.contracts]]
# Phase 11. Nothing underneath may consume replay. An indicator, a fill or a
# metric that could ask whether it was running inside a replay would be free to
# behave differently there - and the whole value of a replay is that it is the
# same code seeing less data.
name = "Nothing beneath replay depends on it"
type = "forbidden"
source_modules = [
    "app.domain.common",
    "app.domain.instrument",
    "app.domain.market",
    "app.domain.risk",
    "app.domain.futures",
    "app.domain.paper",
    "app.domain.performance",
    "app.domain.journal",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
]
forbidden_modules = ["app.domain.replay"]

[[tool.importlinter.contracts]]
# Phase 11. Replay orchestrates; it does not compute. It may drive the existing
# use cases - analysis, paper trading, performance - but reaching a product
# implementation or an indicator routine directly would be the first step to a
# replay-only fill price or a replay-only RSI. Storage stays behind its port.
name = "The replay application layer orchestrates engines and computes nothing"
type = "forbidden"
source_modules = ["app.application.replay"]
forbidden_modules = [
    "app.adapters",
    "app.api",
    "sqlalchemy",
    "app.domain.futures",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.analysis",
    "app.domain.performance",
    "app.domain.risk.margin",
]
# `allow_indirect_imports` is deliberate, and it is the point of the contract.
# Replay *must* reach these engines - through `run_analysis`, through the paper
# service, through the performance service - because using them is how it avoids
# reimplementing them. What it must not do is import one directly, which is what
# a replay-only indicator or fill price would look like on its first day.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "API route and schema modules never reach into adapters directly"
type = "forbidden"
source_modules = ["app.api.routes", "app.api.schemas"]
forbidden_modules = ["app.adapters", "sqlalchemy"]

[[tool.importlinter.contracts]]
# Phase 8. The analysis orchestrator's whole value is that it *orchestrates*:
# every number it reports comes from an engine that already exists and is
# already tested. A second implementation of an indicator or a sizing rule
# living here would be a numerical authority nobody is checking.
#
# The first version of this package imported the CSV adapter directly and broke
# the "application depends only on domain" contract. That was the contract
# working: the file format is infrastructure, and it now arrives through the
# `CandleTextParser` port.
name = "The analysis orchestrator computes nothing itself"
type = "forbidden"
source_modules = ["app.application.analysis"]
forbidden_modules = [
    "app.adapters",
    "app.api",
    "app.domain.technical.momentum",
    "app.domain.technical.smoothing",
    "app.domain.technical.trend_strength",
    "app.domain.technical.volatility",
    "app.domain.technical.volume",
    "app.domain.technical.vwap",
    "app.domain.risk.margin",
    "app.domain.risk.pnl",
    "app.domain.risk.whatif",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Phase 12. A strategy is a rule, and a rule must not know a verified exchange
# fact. If a policy could read this contract's tick size, its levels would
# differ between instruments for reasons the rule never states - and it would be
# carrying a mutable market fact it cannot vouch for. Product knowledge belongs
# to the runner, which holds the snapshot frozen at the start of the run.
#
# Risk, paper trading and replay are forbidden here for the same reason: a
# policy that could size a position, fill one, or ask what time the replay
# thinks it is would be a second, unreviewed copy of an engine that exists.
name = "A strategy policy decides, and knows nothing about products, money or storage"
type = "forbidden"
source_modules = ["app.domain.backtest"]
forbidden_modules = [
    "app.domain.futures",
    "app.domain.instrument",
    "app.domain.risk",
    "app.domain.paper",
    "app.domain.performance",
    "app.domain.journal",
    "app.domain.replay",
    "app.domain.analysis",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
    "app.application",
    "app.adapters",
    "app.api",
]

[[tool.importlinter.contracts]]
# Phase 12. Nothing underneath may consume the backtest package. An indicator, a
# fill or a metric that could ask whether it was running inside a backtest would
# be free to behave differently there - and a backtest is only evidence because
# it is the same code on older data.
name = "Nothing beneath backtest depends on it"
type = "forbidden"
source_modules = [
    "app.domain.common",
    "app.domain.instrument",
    "app.domain.market",
    "app.domain.risk",
    "app.domain.futures",
    "app.domain.paper",
    "app.domain.performance",
    "app.domain.journal",
    "app.domain.technical",
    "app.domain.structure",
    "app.domain.analysis",
    "app.domain.replay",
    "app.domain.suitability",
    "app.domain.synthesis",
    "app.domain.vision",
]
